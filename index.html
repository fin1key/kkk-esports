<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKK — Dota 2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --text: #e8e8e8;
      --muted: #8a8a8a;
      --border: #2a2a2a;
      --card: #111111;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* ===== RAIN CANVAS ===== */
    #rain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.55;
    }

    /* ===== LAYOUT ===== */
    .wrapper {
      position: relative;
      z-index: 2;
    }

    /* ===== HERO ===== */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
      position: relative;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5rem, 15vw, 11rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.9;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 40px rgba(255,255,255,0.08);
    }

    .tagline {
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      max-width: 480px;
    }

    .scroll-hint {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.6;
    }

    /* ===== SECTIONS ===== */
    section {
      padding: 120px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 3rem;
      letter-spacing: -0.02em;
    }

    /* ===== ROSTER ===== */
    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .player-card {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2rem 1.8rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .player-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: #444;
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .player-card:hover {
      border-color: #444;
      transform: translateY(-4px);
      background: #141414;
    }

    .player-card:hover::before {
      transform: scaleY(1);
    }

    .player-role {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.8rem;
    }

    .player-nick {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      letter-spacing: -0.02em;
    }

    .player-name {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 300;
    }

    /* ===== STATEMENT ===== */
    .statement {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    .statement p {
      font-size: 1.25rem;
      font-weight: 300;
      line-height: 1.7;
      color: #ccc;
    }

    /* ===== STATUS ===== */
    .status-box {
      border: 1px solid var(--border);
      background: var(--card);
      padding: 3rem 2rem;
      text-align: center;
      max-width: 600px;
      margin: 0 auto;
    }

    .status-label {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    .status-text {
      font-size: 1.4rem;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    /* ===== FOOTER ===== */
    footer {
      padding: 60px 20px 80px;
      text-align: center;
      border-top: 1px solid var(--border);
      margin-top: 60px;
    }

    footer p {
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .logo {
        font-size: 4.5rem;
      }
      section {
        padding: 80px 16px;
      }
    }
  </style>
</head>
<body>

  <canvas id="rain"></canvas>

  <div class="wrapper">
    <!-- HERO -->
    <section class="hero">
      <h1 class="logo">KKK</h1>
      <p class="tagline">Not competing yet.<br>Already present.</p>
      <div class="scroll-hint">Scroll</div>
    </section>

    <!-- ROSTER -->
    <section>
      <h2 class="section-title">Roster</h2>
      <div class="roster-grid">
        <div class="player-card">
          <div class="player-role">Mid</div>
          <div class="player-nick">zzer1xx</div>
          <div class="player-name">Артём</div>
        </div>
        <div class="player-card">
          <div class="player-role">Carry</div>
          <div class="player-nick">kyoji</div>
          <div class="player-name">Роман</div>
        </div>
        <div class="player-card">
          <div class="player-role">Offlane</div>
          <div class="player-nick">Sigurd</div>
          <div class="player-name">Матвей</div>
        </div>
        <div class="player-card">
          <div class="player-role">Soft Support</div>
          <div class="player-nick">w1zard</div>
          <div class="player-name">Даниил</div>
        </div>
        <div class="player-card">
          <div class="player-role">Hard Support</div>
          <div class="player-nick">betks</div>
          <div class="player-name">Максим</div>
        </div>
      </div>
    </section>

    <!-- STATEMENT -->
    <section>
      <div class="statement">
        <p>
          Мы не обещаем титулы.<br>
          Мы просто уже здесь.
        </p>
      </div>
    </section>

    <!-- STATUS -->
    <section>
      <div class="status-box">
        <div class="status-label">Current Status</div>
        <div class="status-text">Forming. Not competing.</div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer>
      <p>KKK — Dota 2</p>
    </footer>
  </div>

  <script>
    // ===== RAIN EFFECT =====
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d');

    let width, height;
    let drops = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    function createDrops() {
      drops = [];
      const count = Math.floor(width / 4);
      for (let i = 0; i < count; i++) {
        drops.push({
          x: Math.random() * width,
          y: Math.random() * height,
          length: Math.random() * 18 + 12,
          speed: Math.random() * 8 + 6,
          opacity: Math.random() * 0.3 + 0.15
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      for (let drop of drops) {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(200, 200, 200, ${drop.opacity})`;
        ctx.lineWidth = 1.2;
        ctx.moveTo(drop.x, drop.y);
        ctx.lineTo(drop.x, drop.y + drop.length);
        ctx.stroke();

        drop.y += drop.speed;

        if (drop.y > height) {
          drop.y = -drop.length;
          drop.x = Math.random() * width;
        }
      }

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => {
      resize();
      createDrops();
    });

    resize();
    createDrops();
    draw();
  </script>
</body>
</html>
